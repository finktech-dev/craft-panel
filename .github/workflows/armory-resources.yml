name: Armory resource integrity

on:
  push:
    paths:
      - 'pointblank_durability_mod/**'
      - 'tools/verify_armory_assets.py'
      - '.github/workflows/armory-resources.yml'
  pull_request:
    paths:
      - 'pointblank_durability_mod/**'
      - 'tools/verify_armory_assets.py'
      - '.github/workflows/armory-resources.yml'

permissions:
  contents: read

jobs:
  verify-resources:
    name: Verify items, recipes, models and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify portable Armory resources
        run: python tools/verify_armory_assets.py
