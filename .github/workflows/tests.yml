name: Tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    # Windows 10 and 11 are the supported hosts, so the suite runs on Windows.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            web_panel/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Keep checked-out bytes identical to the repository so the CSS comparison is exact.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_panel/frontend/package-lock.json
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem web_panel/static/js -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Settings scripts regression test
        run: node web_panel/tests/test_admin_js_regression.js
      - name: Console page test
        run: node web_panel/tests/test_console.js
      - name: Compiled stylesheet is up to date
        shell: pwsh
        working-directory: web_panel/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
          git diff --exit-code -- ../static/css/tailwind.css
          if ($LASTEXITCODE -ne 0) {
            Write-Error "static/css/tailwind.css is stale: run 'npm run build:css' in web_panel/frontend and commit the result."
            exit 1
          }
